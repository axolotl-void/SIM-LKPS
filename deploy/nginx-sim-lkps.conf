# nginx — dipakai kalau server kampus punya nginx sendiri (bukan cPanel).
# Pasang: /etc/nginx/sites-available/sim-lkps → symlink ke sites-enabled → nginx -t → reload.
# Sertifikat: certbot --nginx -d lkps.bbg.ac.id

server {
    listen 80;
    server_name lkps.bbg.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lkps.bbg.ac.id;

    # Sertifikat dari certbot (atau cert yang diterbitkan kampus)
    ssl_certificate     /etc/letsencrypt/live/lkps.bbg.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lkps.bbg.ac.id/privkey.pem;

    # Unggahan bukti (foto/PDF) bisa besar
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
